services:
  http-server-projeto-korp:
    build:
      context: ./app
      dockerfile: Dockerfile
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/http-server-projeto-korp", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - korp-network

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      http-server-projeto-korp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/projeto-korp || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - korp-network

networks:
  korp-network:
    driver: bridge
